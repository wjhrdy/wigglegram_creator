name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Allow building the app on demand from the Actions tab (no release is made).
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      # Don't cancel other platforms when one fails — we want every
      # platform's result in a single run.
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            arch: 'x64'
            spec: specs/linux.spec
          # Linux arm64 (public preview)
          - os: ubuntu-24.04-arm
            arch: 'arm64'
            spec: specs/linux.spec
          # Windows x64
          - os: windows-latest
            arch: 'x64'
            spec: specs/windows.spec
          # macOS arm64 (Apple Silicon)
          - os: macos-latest
            arch: 'arm64'
            spec: specs/macos.spec
          # NOTE: Windows arm64 is intentionally omitted. scikit-image has no
          # prebuilt win-arm64 wheel and the runners lack a C toolchain, so the
          # build fails. Windows arm64 users can run the x64 build via emulation.
          #
          # NOTE: Intel macOS (macos-13) is intentionally omitted. GitHub has
          # retired the macOS 13 runner image, so those jobs queue forever with no
          # runner ever assigned. Combined with max-parallel: 1, that stuck job also
          # blocked the macos-latest job from ever starting. Only the arm64
          # (Apple Silicon) runner is used; Intel Macs can run it under Rosetta.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt X11 dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-render-util0 \
            libxcb-icccm4 \
            libxkbcommon-x11-0 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Build with PyInstaller
        run: uv run pyinstaller ${{ matrix.spec }}

      - name: Zip build output (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -l dist
          cd dist
          zip -r ../wigglegram-creator-${{ runner.os }}-${{ matrix.arch }}.zip .
        shell: bash

      - name: Zip build output (macOS)
        if: runner.os == 'macOS'
        run: |
          ls -l dist
          # The macOS spec emits both the .app bundle and the intermediate
          # COLLECT onedir folder (a duplicate of the bundle payload). Ship only
          # the .app, using ditto so bundle metadata/permissions are preserved.
          ditto -c -k --sequesterRsrc --keepParent \
            dist/*.app \
            wigglegram-creator-${{ runner.os }}-${{ matrix.arch }}.zip
        shell: bash

      - name: Zip build output (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem dist
          Compress-Archive -Path dist/* -DestinationPath wigglegram-creator-${{ runner.os }}-${{ matrix.arch }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wigglegram-creator-${{ runner.os }}-${{ matrix.arch }}
          path: wigglegram-creator-${{ runner.os }}-${{ matrix.arch }}.zip

  release:
    needs: build
    # Only publish a GitHub Release when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
