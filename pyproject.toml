[project]
name = "wigglegram_creator"
version = "0.2.0"
description = "Wigglegram creator"
requires-python = ">=3.12"
authors = [
    { name = "Willy Hardy"}
]

dependencies = [
    "imageio-ffmpeg",
    "Pillow",
    "PySide6",
    "imageio",
    "scikit-image",
    "numpy",
    "opencv-python"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller"
]

[project.scripts]
wigglegram-creator = "create_wiggle:launch_gui"
create_wiggle = "create_wiggle:launch_gui"

[tool.hatch.build.targets.wheel]
packages = ["."]